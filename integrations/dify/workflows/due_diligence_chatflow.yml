app:
  description: 基于ddg-agent核心引擎的深度尽调工作流，Dify作为入口编排层
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: workflow
  name: DDG智能尽调
  use_icon_as_answer_icon: false
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 50
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 你好！我是DDG智能尽调助手。我可以帮你对目标企业进行深度尽调分析。请直接输入企业名称，如：帮我做一份华为技术有限公司的尽调报告
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 帮我做一份华为技术有限公司的尽调报告
    - 腾讯控股的主要业务是什么？
    - 搜索宁德时代最近的新闻
    - 比亚迪的法律诉讼情况怎么样？
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
